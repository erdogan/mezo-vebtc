name: Update veBTC Dashboard

on:
  schedule:
    # Run every 30 minutes to avoid RPC rate limiting
    - cron: '*/30 * * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cached data
        uses: actions/cache/restore@v4
        with:
          path: vebtc_data.json
          key: dashboard-data
          restore-keys: dashboard-data

      - name: Fallback to gh-pages data
        run: |
          if [ ! -f "vebtc_data.json" ]; then
            echo "No cache found, trying gh-pages..."
            git fetch origin gh-pages 2>/dev/null || true
            git show origin/gh-pages:vebtc_data.json > vebtc_data.json 2>/dev/null || echo "No existing data, starting fresh"
          else
            echo "Using cached vebtc_data.json ($(du -h vebtc_data.json | cut -f1))"
          fi

      - name: Generate dashboard and data
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python vebtc_dashboard.py

          if [ ! -f "index.html" ] || [ ! -f "vebtc_data.json" ]; then
            echo "Error: Required files not generated"
            exit 1
          fi

          echo "Dashboard generated successfully"

      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: vebtc_data.json
          key: dashboard-data

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          cp index.html deploy/
          echo "Dashboard updated at $(date)" > deploy/last_updated.txt
          touch deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update dashboard - ${{ github.sha }}'
